name: Analytics delivery
on:
  schedule:
    - cron: '30 6 * * 1'
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Analytics operation'
        type: choice
        required: true
        options:
          - weekly
          - retry
permissions:
  contents: read
concurrency:
  group: snowdex-analytics-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Invoke scheduled delivery
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_OPERATION: ${{ inputs.operation }}
        run: |
          case "$EVENT_NAME:$SCHEDULE:$MANUAL_OPERATION" in
            'schedule:30 6 * * 1:') node scripts/analytics-scheduler.mjs weekly ;;
            'schedule:15 8 * * *:') node scripts/analytics-scheduler.mjs retry ;;
            'workflow_dispatch::weekly') node scripts/analytics-scheduler.mjs weekly ;;
            'workflow_dispatch::retry') node scripts/analytics-scheduler.mjs retry ;;
            *) exit 1 ;;
          esac
